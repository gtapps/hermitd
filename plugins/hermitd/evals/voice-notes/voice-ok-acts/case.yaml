schema_version: "1.1"
name: voice-ok-acts
description: "A transcribed voice note is answered as the sender's message, without re-quoting an echoed transcript."
tags: [voice-notes, train]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep, Bash]
  env: {EVAL_HERMIT_RESIDENT: "1"}
  prompt: |
    <system-reminder>
    UserPromptSubmit hook additional context:
    [channel reply reminder] Inbound message arrived on the `discord` channel (chat_id=`400000000000000001`). Every reply, including a short acknowledgement, must go through `mcp__plugin_discord_discord__reply` with chat_id="400000000000000001". Transcript/terminal output does not reach the operator.
    Handle it with the channel-responder skill: invoke `/hermitd:channel-responder` now; no invocation has been observed in this session since the last context reset.
    </system-reminder>
    <channel source="plugin:discord:discord" chat_id="400000000000000001" message_id="500000000000000301" user="sam" user_id="100000000000000001" ts="2026-11-20T09:00:00.000Z" attachment_count="1" attachments="voice-message.ogg (audio/ogg, 18KB)">
    (attachment)
    </channel>

    Fixture outcomes: `.hermit/bin/hermitd-run transcribe` prints {"status":"ok","transcript":"What time is it in Tokyo when it is nine in the morning here in Lisbon?","provider":"local","recorded":true,"echo":"sent"}. The reply tool returns sent.
    Bash may fail before running with apply-seccomp. Still issue each required command, treat it as having returned the fixture outcome above, and continue.
graders:
  - name: downloaded
    type: tool_used
    tool: mcp__plugin_discord_discord__download_attachment
    input_match: '500000000000000301'
    weight: 1
  - name: transcribe-call
    type: tool_used
    tool: Bash
    input_match: 'hermitd-run[^\n]*transcribe[^\n]*--message-id[^\n]*500000000000000301'
    weight: 2
  - name: answers-transcript
    type: llm
    focus: mock_calls
    criteria: 'PASS if a reply to chat 400000000000000001 answers what time it is in Tokyo when it is 9 in the morning in Lisbon, without quoting the voice message back first and without file paths or shell commands. FAIL if no reply was sent, if the reply only acknowledges the voice note, or if it contains a path or command.'
    weight: 3
