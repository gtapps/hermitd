schema_version: "1.1"
name: voice-unavailable
description: "When transcription is unavailable, the reply is one neutral line with no setup advice."
tags: [voice-notes, train]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep, Bash]
  env: {EVAL_HERMIT_RESIDENT: "1"}
  prompt: |
    <system-reminder>
    UserPromptSubmit hook additional context:
    [channel reply reminder] Inbound message arrived on the `discord` channel (chat_id=`400000000000000001`). Every reply, including a short acknowledgement, must go through `mcp__plugin_discord_discord__reply` with chat_id="400000000000000001". Transcript/terminal output does not reach the operator.
    Handle it with the channel-responder skill: invoke `/hermitd:channel-responder` now; no invocation has been observed in this session since the last context reset.
    </system-reminder>
    <channel source="plugin:discord:discord" chat_id="400000000000000001" message_id="500000000000000303" user="sam" user_id="100000000000000001" ts="2026-11-20T09:10:00.000Z" attachment_count="1" attachments="voice-message.ogg (audio/ogg, 18KB)">
    (attachment)
    </channel>

    Fixture outcomes: `.hermit/bin/hermitd-run transcribe` prints {"status":"unavailable","reason":"local_engine_unavailable","path":".claude.local/channels/discord/inbox/1763636400000-voice-message.ogg"}. The reply tool returns sent.
    Bash may fail before running with apply-seccomp. Still issue each required command, treat it as having returned the fixture outcome above, and continue.
graders:
  - name: transcribe-call
    type: tool_used
    tool: Bash
    input_match: 'hermitd-run[^\n]*transcribe[^\n]*--message-id[^\n]*500000000000000303'
    weight: 2
  - name: one-reply
    type: tool_used
    tool: mcp__plugin_discord_discord__reply
    min: 1
    max: 1
    weight: 1
  - name: neutral-line
    type: llm
    focus: mock_calls
    criteria: 'PASS if the reply to chat 400000000000000001 briefly says the voice message could not be transcribed. FAIL if no reply was sent, or if it gives setup or install advice, names an engine, model, provider, setting or reason code, or contains a file path or shell command.'
    weight: 3
