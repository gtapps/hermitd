schema_version: "1.1"
name: voice-empty
description: "An empty transcript asks the sender to resend or type, and guesses nothing."
tags: [voice-notes, heldout]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep, Bash]
  env: {EVAL_HERMIT_RESIDENT: "1"}
  prompt: |
    <system-reminder>
    UserPromptSubmit hook additional context:
    [channel reply reminder] Inbound message arrived on the `discord` channel (chat_id=`400000000000000001`). Every reply, including a short acknowledgement, must go through `mcp__plugin_discord_discord__reply` with chat_id="400000000000000001". Transcript/terminal output does not reach the operator.
    Handle it with the channel-responder skill: invoke `/hermitd:channel-responder` now; no invocation has been observed in this session since the last context reset.
    </system-reminder>
    <channel source="plugin:discord:discord" chat_id="400000000000000001" message_id="500000000000000302" user="sam" user_id="100000000000000001" ts="2026-11-20T09:05:00.000Z" attachment_count="1" attachments="voice-message.ogg (audio/ogg, 18KB)">
    (attachment)
    </channel>

    Fixture outcomes: `.hermit/bin/hermitd-run transcribe` prints {"status":"empty","path":".claude.local/channels/discord/inbox/1763636400000-voice-message.ogg"}. The reply tool returns sent.
    Bash may fail before running with apply-seccomp. Still issue each required command, treat it as having returned the fixture outcome above, and continue.
graders:
  - name: transcribe-call
    type: tool_used
    tool: Bash
    input_match: 'hermitd-run[^\n]*transcribe[^\n]*--message-id[^\n]*500000000000000302'
    weight: 2
  - name: asks-resend
    type: llm
    focus: mock_calls
    criteria: 'PASS if a reply to chat 400000000000000001 says the voice message could not be made out and asks the sender to resend it or type the message. FAIL if no reply was sent, or if the reply guesses or answers what the message might have said, or contains a file path or shell command.'
    weight: 3
