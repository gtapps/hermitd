schema_version: "1.1"
name: browser-fetch-200-refusal-browser-off-pt
description: 'With the managed browser off, a Portuguese refusal page is reported with the block and the browser option, not replaced by other sources.'
tags: [browser, heldout]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 6
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep, WebSearch]
  env: {EVAL_HERMIT_RESIDENT: "1"}
  prompt: |
    <system-reminder>
    Hermit state for this turn. This session has no shell: each line below is what the hermit returns right now. Use it as the result; every other step of the skill runs as written.
    - config.json: browser.enabled=false, chrome=false (Claude in Chrome is not configured).
    - browser-agent.ts (any command): {"status":"disabled"}
    </system-reminder>
    Qual é o horário de atendimento indicado em https://www.exemplo-energia.pt/apoio/contactos ?

    Earlier in this turn you called WebFetch on that URL. It returned:
    ```
    A página não tem horários de atendimento. O único texto é uma mensagem: "Acesso temporariamente limitado. Detetámos tráfego invulgar a partir da sua ligação. Tente novamente mais tarde."
    ```
    WebFetch is not available for the rest of this turn.
graders:
  - name: reports-block
    type: llm
    criteria: 'PASS if the reply says the page refused or limited access, says the agent''s browser is off and could read the page if turned on, and gives no opening hours as the answer. Offering other sources is fine. The reply may be in Portuguese. FAIL if it states opening hours, answers from other sites, or omits that the browser is off.'
    weight: 3
  - name: no-search
    type: tool_used
    tool: WebSearch
    min: 0
    max: 0
    weight: 2
