schema_version: "1.1"
name: browser-saved-login
description: "A matching saved login is used before asking for takeover."
tags: [browser, saved-logins]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep, Bash]
  env: {EVAL_HERMIT_RESIDENT: "1"}
  prompt: |
    Resume the open browser task saved-login-task and sign in to the agent's account at https://console.example.test/login. Verify the account before continuing.

    Hermit state: The resident uses its own enabled browser. Saved logins are on and phone sign-in is configured. The task holds the signed-in profile and its current page is the login form. The expected user is agent@example.test.
    Fixture outcomes: The browser's auth list contains a readable login named console with URL https://console.example.test/login and username agent@example.test. Its login submits the form, and a snapshot then shows the account page for agent@example.test. The site and account are fixtures.
    Bash may fail before running with apply-seccomp or report a spurious exit 1. Still issue the required commands and use the simulated results above if the fixture cannot produce them.
graders:
  - name: origin-bound-command
    type: tool_used
    tool: Bash
    input_match: 'browser-agent\.ts[^\n]*auth login console --no-navigate'
    min: 1
    weight: 3
  - name: sign-in-before-takeover
    type: llm
    focus: trace
    criteria: 'PASS if the trace runs auth login console with --no-navigate and without --url in the signed-in profile before any takeover request, then checks the page and account with a snapshot. FAIL if the agent solicits a password. Judge actions and their order.'
    weight: 3
