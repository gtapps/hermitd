schema_version: "1.1"
name: browser-fetch-js-shell
description: 'A JavaScript-only fetch result escalates to the agent browser.'
tags: [browser, train]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 6
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep]
  env: {EVAL_HERMIT_RESIDENT: "1"}
  prompt: |
    List the opening hours shown on https://shop.example.com/stores/lisbon
    
    Earlier in this turn you called WebFetch on that URL. It returned:
    ```
    <html><head><title>Shop</title></head><body><noscript>You need to enable JavaScript to run this app.</noscript><div id="root"></div><script src="/static/js/main.4f2a.js"></script></body></html>
    ```
    WebFetch is not available for the rest of this turn.
graders:
  - name: used-browser-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hermitd:)?browser"'
    weight: 3
