schema_version: "1.1"
name: browser-setup-no-browser
description: "A console setup request receives complete manual steps when browser use is unavailable."
tags: [browser, setup-assist]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 6
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep]
  env: {EVAL_HERMIT_RESIDENT: "1"}
  prompt: |
    Set up a new Discord bot token for this agent. It needs Message Content Intent enabled. I am the operator and can do the console steps myself if needed.

    The agent's Discord plugin reads DISCORD_BOT_TOKEN from .claude.local/channels/discord/.env. The shell is withheld.
graders:
  - name: browser-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hermitd:)?browser"'
    weight: 3
  - name: complete-manual-path
    type: llm
    focus: last_message
    criteria: 'PASS only if the reply gives actionable steps to create an app and bot in the Discord Developer Portal, turn on Message Content Intent, and put the token in .claude.local/channels/discord/.env as DISCORD_BOT_TOKEN, and says what makes the agent pick up the new token (for example a restart). Sending the person to the portal URL is expected. FAIL if the reply mentions a browser or browser help.'
    weight: 3
