schema_version: "1.1"
name: browser-form-fill
description: 'A request to fill a web form uses the agent browser.'
tags: [browser, heldout]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 6
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep]
  env: {EVAL_HERMIT_RESIDENT: "1"}
  prompt: |
    Fill in the contact form on https://example.org/contact with name Ana Silva, email ana@example.org and the message "Please call me back about the quote.", then submit it.
graders:
  - name: used-browser-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hermitd:)?browser"'
    weight: 3
