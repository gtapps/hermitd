schema_version: "1.1"
name: browser-fetch-200-refusal
description: 'A page that loads but only shows an access refusal escalates to the agent browser before any search.'
tags: [browser, train]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 6
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep, WebSearch]
  env: {EVAL_HERMIT_RESIDENT: "1"}
  prompt: |
    What is the return window on https://store.example.co.uk/help/returns ?

    Earlier in this turn you called WebFetch on that URL. It returned:
    ```
    The page does not contain any returns policy. Its only content is an error message: "Access Denied. You don't have permission to access this page on this server. Reference #18.6f2c1702.1764261600.2a4e9b1"
    ```
    WebFetch is not available for the rest of this turn.
graders:
  - name: used-browser-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hermitd:)?browser"'
    weight: 3
  - name: no-search
    type: tool_used
    tool: WebSearch
    min: 0
    max: 0
    weight: 2
