schema_version: "1.1"
name: browser-operator-account-chrome
description: "With chrome on, the operator's own signed-in account is routed to Claude in Chrome."
tags: [browser, train]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep]
  env: {EVAL_HERMIT_RESIDENT: "1"}
  prompt: |
    How many unread emails do I have in my own inbox at https://mail.example.test? I'm signed in there in my Chrome.

    Hermit state: config.json has chrome: true and browser.default agent-browser.
graders:
  - name: chrome-route
    type: tool_used
    tool: ToolSearch
    input_match: '[Cc]hrome'
    weight: 3
  - name: browser-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hermitd:)?browser"'
    weight: 1
