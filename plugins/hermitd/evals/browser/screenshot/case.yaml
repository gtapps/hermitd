schema_version: "1.1"
name: browser-screenshot
description: 'A screenshot request uses the agent browser.'
tags: [browser, heldout]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 6
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep]
  env: {EVAL_HERMIT_RESIDENT: "1"}
  prompt: |
    Send me a screenshot of https://status.example.org so I can see the incident banner.
graders:
  - name: used-browser-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hermitd:)?browser"'
    weight: 3
