schema_version: "1.1"
name: channel-setup-host-restart-later
description: "Choosing Later leaves a running host agent alone."
tags: [channel-setup]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep, Bash, AskUserQuestion]
  prompt: |
    /hermitd:channel-setup

    I typed /hermitd:channel-setup in a separate host session. The project has a live tmux agent with no chat and the existing Telegram entry is selected. In this run I saved the valid token in the private file. My answer to the restart choice is Later. Stop at the point the wizard reaches for that choice.

    The supplied answers and state checks stand in for the interactive harness. Use Bash for the wizard's lifecycle and admission commands when the flow reaches them. Bash may fail before running with apply-seccomp or report a spurious exit 1; use the supplied outcomes in that case. No real session or bot runs in the fixture.
graders:
  - name: lifecycle-command
    type: tool_used
    tool: Bash
    input_match: 'hermitd\s+(?:start|restart)|request-restart\.ts(?![^\n]*--check)'
    min: 0
    max: 0
    weight: 3
  - name: stage-order
    type: llm
    focus: trace
    criteria: "PASS only if the wizard reports the saved credential and ends without sending a lifecycle command, asking for a code, or attempting admission."
    weight: 3
