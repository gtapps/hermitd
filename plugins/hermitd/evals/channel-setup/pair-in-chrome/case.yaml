schema_version: "1.1"
name: channel-setup-pair-in-chrome
description: "An accepted Chrome walk-through can pair the bot after account-specific consent."
tags: [channel-setup]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 16
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep, Bash, AskUserQuestion]
  prompt: |
    /hermitd:channel-setup

    The channel is selected, its credential was validated and the bot is running. I accepted the Chrome walk-through in this run. Continue from the channel access stage. Use .hermit/chrome-context.md for the simulated tabs context and account. Open .hermit/chrome-bot-chat.md for the simulated chat. Read .hermit/chrome-bot-reply.md only after sending the simulated DM. My pairing choice is Pair in your Chrome. When you name the signed-in account and ask whether to make it an approver, my answer is yes.

    Use the fixture in place of the real browser. Run the pairing command with the code from the simulated bot reply. Do not reach out to a live service.
graders:
  - name: browser-pairing-consent-and-source
    type: llm
    focus: trace
    criteria: 'PASS only if the wizard names the signed-in account and its approver role, obtains a yes before sending the simulated DM, then takes the code from the bot reply in that chat and runs channel-pair with it. Pairing must keep the native prompt. FAIL if it takes a code from any other source or sends the DM before consent. Judge the order and mechanism regardless of channel or language.'
    weight: 3
