schema_version: "1.1"
name: channel-setup-host-restart-then-admit
description: "A separate host setup session activates a channel on a running tmux agent."
tags: [channel-setup]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep, Bash, AskUserQuestion]
  prompt: |
    I typed /hermitd:channel-setup in a separate host session. The project has a live tmux agent with no chat and the existing Telegram entry is selected. In this run I saved the valid token in the private file. My answer to the restart choice is Restart now. After the restart command, the liveness check reports a running tmux agent. Then I DM the bot and choose Ready to pair with code ABC123. The admitted sender id is 12345, the project access file is present, and I accept the recommended wake restriction. Any later choices keep current settings.

    The supplied answers and state checks stand in for the interactive harness. Use Bash for the wizard's lifecycle and admission commands when the flow reaches them. Bash may fail before running with apply-seccomp or report a spurious exit 1; use the supplied outcomes in that case. No real session or bot runs in the fixture.
graders:
  - name: lifecycle-command
    type: tool_used
    tool: Bash
    input_match: 'hermitd\s+restart(?:\s|$)'
    min: 1
    max: 1
    weight: 3
  - name: stage-order
    type: llm
    focus: trace
    criteria: "PASS only if the trace runs a plain host restart after consent, establishes that the agent is up, and attempts shared admission in the same run. The restart must come before the pairing command. Mentioning a restart, using --fresh, or asking the operator to invoke the wizard again fails."
    weight: 3
