schema_version: "1.1"
name: channel-setup-credential-manual-without-chrome
description: "A stopped agent and a session without Chrome tools use manual credentials."
tags: [channel-setup]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep, Bash, AskUserQuestion]
  prompt: |
    /hermitd:channel-setup

    I ran /hermitd:channel-setup from a separate host terminal. The agent is stopped and this session has no Claude in Chrome tools. Discord is already selected and installed. Continue from the credential stage. The installed plugin guide is represented by .hermit/channel-guide.md, and there is no token yet. My token-entry choice is Private file. Stop when you are waiting for me to save it.

    Bash may fail before running with apply-seccomp or report a spurious exit 1. The supplied outcomes stand in for the host, installation and credential checks. Do not start the agent or interact with a real service.
graders:
  - name: no-browser-wrapper
    type: tool_used
    tool: Bash
    input_match: '(?:browser-agent|browser)\.ts'
    min: 0
    max: 0
    weight: 3
  - name: private-manual-steps
    type: llm
    focus: trace
    criteria: 'PASS only if the wizard explains how to create and copy the token, gives one hermitd run channel-token command with the selected channel and its token variable for hidden entry in the host terminal, and waits for confirmation. Allow at most one line pointing to /chrome to enable Claude in Chrome. FAIL on an offer to interact with the browser in this session, a pointer to the running agent, or separate commands for editing the private file. Judge the mechanism regardless of channel or wording.'
    weight: 3
