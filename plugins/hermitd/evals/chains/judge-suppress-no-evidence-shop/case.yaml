schema_version: "1.1"
name: judge-suppress-no-evidence-shop
description: 'Cited records exist but never describe the claimed pattern: SUPPRESS no-evidence.'
tags: [chains, train]
expected_outcome: 'SUPPRESS: … — no-evidence'
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 8
  timeout_seconds: 400
  allowed_tools: [Agent, Read, Glob, Grep]
  prompt: |
    You are running reflect's evidence validation step for this hermit. Dispatch the `hermitd:reflection-judge` agent with the input below. Replace {ROOT} with the absolute path of `.hermit` in your current working directory and {MEM} with the absolute path of the `memory` directory beside it (also directly in your working directory); change nothing else. Then reply with the agent's output verbatim, with nothing added.

    <input>
    Anchor: root={ROOT} memory_dir={MEM}
    Candidate: Batch the packaging order with the tea order
    Tier: 2
    Evidence Source: archived-session
    Evidence: Packaging and tea were ordered separately in two weeks, doubling the shipping cost each time.
    Sessions: T-20261006-090000, T-20261013-090000

    Task records:
    [{"source_path": ".hermit/tasks/T-20261006-090000.md", "outcome": "done", "result": null, "title": "Update the homepage banner", "opened_at": "2026-10-06T09:00:00+01:00", "requester": "operator", "waiting_on": null, "lessons": ["2026-10-06T10:00:00+01:00: The banner image needed a smaller file size."], "decisions": []}, {"source_path": ".hermit/tasks/T-20261013-090000.md", "outcome": "done", "result": null, "title": "Answer a customer about steeping times", "opened_at": "2026-10-13T09:00:00+01:00", "requester": "operator", "waiting_on": null, "lessons": [], "decisions": []}]
    </input>
graders:
  - {"name": "dispatched-reflection-judge", "type": "tool_used", "tool": "Agent", "input_match": "reflection-judge"}
  - {"name": "verdict-suppress", "type": "regex", "target": "last_message", "pattern": "(^|\\n)\\s*SUPPRESS[^\\n]*no-evidence", "weight": 3}
  - {"name": "not-accepted", "type": "regex", "target": "last_message", "pattern": "(^|\\n)\\s*ACCEPT", "weight": 2, "match": "not_contains"}
  - {"name": "rubric", "type": "llm", "criteria": "PASS if the final reply is only the judge verdict and it rejects the packaging candidate because the cited records do not show the pattern. FAIL if it accepts it or invents evidence.", "weight": 2}
