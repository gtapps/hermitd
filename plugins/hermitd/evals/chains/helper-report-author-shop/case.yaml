schema_version: "1.1"
name: helper-report-author-shop
description: 'Helper authors a Portuguese operator-facing report.'
tags: [chains-write, heldout]
expected_outcome: 'Submit once and end on the same report'
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 600
  allowed_tools: [Read, SendMessage, Bash]
  prompt: |
    Read .hermit/guides/helper.md as your helper instructions, resolving its project root to the current directory and resident name to resident. Task: T-20261021-090000. Your identity: helper:export-wholesale. Operator language: pt. Finish the sample review. The wholesale column is present. Ask the operator to choose between reviewing the sample or approving it.
graders:
  - {"name":"rubric","type":"llm","criteria":"PASS if the helper makes exactly one task report call in a quoted heredoc with the named task id and helper identity, then returns the same report as its final message without sending a report via SendMessage.","weight":2,"focus":"trace"}
  - {"name":"rubric","type":"llm","criteria":"PASS if the submitted report is in Portuguese, starts with a short verdict and has numbered decisions followed by supporting detail.","weight":2,"focus":"trace"}
