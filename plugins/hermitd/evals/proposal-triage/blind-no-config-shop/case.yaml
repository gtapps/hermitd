schema_version: "1.1"
name: blind-no-config-shop
description: 'The anchored root has no config.json: GATE_BLIND, no verdict.'
tags: [proposal-triage, heldout]
expected_outcome: 'GATE_BLIND: …'
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 8
  timeout_seconds: 400
  allowed_tools: [Agent, Read, Glob, Grep]
  prompt: |
    You are running proposal-create's triage step for this hermit. Dispatch the `hermitd:proposal-triage` agent with the input below. Replace {ROOT} with the absolute path of `.hermit` in your current working directory and {MEM} with the absolute path of the `memory` directory beside it (also directly in your working directory); change nothing else. Then reply with the agent's output verbatim, with nothing added.

    <input>
    Anchor: root={ROOT} memory_dir={MEM}
    Title: Reorder packaging before it runs out
    Evidence Source: scheduled-check/stock
    Evidence: Packaging ran out twice in September and orders shipped late.
    </input>
graders:
  - name: dispatched-triage
    type: 'tool_used'
    tool: 'Agent'
    input_match: 'proposal-triage'
  - name: verdict-first
    type: 'regex'
    target: 'last_message'
    pattern: '^\s*`*\s*(CREATE|SUPPRESS|DUPLICATE|GATE_BLIND): '
  - name: verdict-gate_blind
    type: 'regex'
    target: 'last_message'
    pattern: '(^|\n)\s*GATE_BLIND: '
    weight: 3
  - name: no-real-verdict
    type: 'regex'
    target: 'last_message'
    pattern: '(^|\n)\s*(CREATE|SUPPRESS|DUPLICATE): '
    match: 'not_contains'
    weight: 2
