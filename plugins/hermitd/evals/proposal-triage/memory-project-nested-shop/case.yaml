schema_version: "1.1"
name: memory-project-nested-shop
description: 'A project memory whose type sits under metadata covers the idea: SUPPRESS covered-by-memory.'
tags: [proposal-triage, heldout]
expected_outcome: 'SUPPRESS … covered-by-memory, memory_ref: project_q4_priorities.md'
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 8
  timeout_seconds: 400
  allowed_tools: [Agent, Read, Glob, Grep]
  prompt: |
    You are running proposal-create's triage step for this hermit. Dispatch the `hermitd:proposal-triage` agent with the input below. Replace {ROOT} with the absolute path of `.hermit` in your current working directory and {MEM} with the absolute path of the `memory` directory beside it (also directly in your working directory); change nothing else. Then reply with the agent's output verbatim, with nothing added.

    <input>
    Anchor: root={ROOT} memory_dir={MEM}
    Title: Redesign the shop homepage this quarter
    Evidence Source: capability-brainstorm
    Evidence: The homepage still shows the summer collection and the bounce rate rose from 41% to 55% over two months.
    </input>
graders:
  - name: dispatched-triage
    type: 'tool_used'
    tool: 'Agent'
    input_match: 'proposal-triage'
  - name: verdict-first
    type: 'regex'
    target: 'last_message'
    pattern: '^\s*`*\s*(CREATE|SUPPRESS|DUPLICATE|GATE_BLIND): '
  - name: verdict-suppress
    type: 'regex'
    target: 'last_message'
    pattern: '(^|\n)\s*SUPPRESS: [^\n]*covered-by-memory'
    weight: 3
  - name: meta-memory_ref
    type: 'regex'
    target: 'last_message'
    pattern: '(^|\n)\s*memory_ref: project_q4_priorities\.md'
    weight: 2
