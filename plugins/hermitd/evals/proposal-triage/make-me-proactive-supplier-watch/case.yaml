schema_version: "1.1"
name: make-me-proactive-supplier-watch
description: 'A supplier price watch is grounded in a manual check the operator relies on.'
tags: [proposal-triage, heldout]
expected_outcome: 'CREATE: Watch the supplier price for a drop below €50'
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 8
  timeout_seconds: 400
  allowed_tools: [Agent, Read, Glob, Grep]
  prompt: |
    You are running proposal-create's triage step for this hermit. Dispatch the `hermitd:proposal-triage` agent with the input below. Replace {ROOT} with the absolute path of `.hermit` in your current working directory and {MEM} with the absolute path of the `memory` directory beside it (also directly in your working directory); change nothing else. Then reply with the agent's output verbatim, with nothing added.

    <input>
    Anchor: root={ROOT} memory_dir={MEM}
    Title: Watch the supplier price for a drop below €50
    Evidence Source: make-me-proactive
    Evidence: project_supplier_price.md records that the operator checks the supplier page by hand each morning to decide when to place the wholesale order. A saved watch can check every six hours and alert the operator when the case price drops below €50.
    </input>
graders:
  - name: dispatched-triage
    type: 'tool_used'
    tool: 'Agent'
    input_match: 'proposal-triage'
  - name: verdict-first
    type: 'regex'
    target: 'last_message'
    pattern: '^\s*`*\s*(CREATE|SUPPRESS|DUPLICATE|GATE_BLIND): '
  - name: verdict-create
    type: 'regex'
    target: 'last_message'
    pattern: '(^|\n)\s*CREATE: Watch the supplier price for a drop below €50'
    weight: 3
  - name: not-covered-by-memory
    type: 'regex'
    target: 'last_message'
    pattern: 'covered-by-memory'
    match: 'not_contains'
    weight: 2
