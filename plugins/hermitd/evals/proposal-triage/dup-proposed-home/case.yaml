schema_version: "1.1"
name: dup-proposed-home
description: 'Same problem as an open proposed proposal: DUPLICATE.'
tags: [proposal-triage, train]
expected_outcome: 'DUPLICATE: … — PROP-009'
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 8
  timeout_seconds: 400
  allowed_tools: [Agent, Read, Glob, Grep]
  prompt: |
    You are running proposal-create's triage step for this hermit. Dispatch the `hermitd:proposal-triage` agent with the input below. Replace {ROOT} with the absolute path of `.hermit` in your current working directory and {MEM} with the absolute path of the `memory` directory beside it (also directly in your working directory); change nothing else. Then reply with the agent's output verbatim, with nothing added.

    <input>
    Anchor: root={ROOT} memory_dir={MEM}
    Title: Skip watering the garden on rainy days
    Evidence Source: scheduled-check/irrigation
    Evidence: The irrigation ran on 4 of the last 6 rainy days (rain gauge above 5 mm), soaking the lawn and wasting water.
    </input>
graders:
  - name: dispatched-triage
    type: 'tool_used'
    tool: 'Agent'
    input_match: 'proposal-triage'
  - name: verdict-first
    type: 'regex'
    target: 'last_message'
    pattern: '^\s*`*\s*(CREATE|SUPPRESS|DUPLICATE|GATE_BLIND): '
  - name: verdict-duplicate
    type: 'regex'
    target: 'last_message'
    pattern: '(^|\n)\s*DUPLICATE: [^\n]*PROP-009'
    weight: 3
