schema_version: "1.1"
name: ledger-exemption-home
description: 'A ledger-backed candidate is never suppressed covered-by-memory even when memory matches: CREATE.'
tags: [proposal-triage, heldout]
expected_outcome: 'CREATE (not covered-by-memory)'
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 8
  timeout_seconds: 400
  allowed_tools: [Agent, Read, Glob, Grep]
  prompt: |
    You are running proposal-create's triage step for this hermit. Dispatch the `hermitd:proposal-triage` agent with the input below. Replace {ROOT} with the absolute path of `.hermit` in your current working directory and {MEM} with the absolute path of the `memory` directory beside it (also directly in your working directory); change nothing else. Then reply with the agent's output verbatim, with nothing added.

    <input>
    Anchor: root={ROOT} memory_dir={MEM}
    Title: Notify when the freezer door is left open
    Evidence Source: archived-session
    Evidence: The freezer door was left open for more than 10 minutes five times last week and food partly thawed once.
    Artifact: state/observations.jsonl — freezer-door-open-10m recorded 5 times in 7 days
    </input>
graders:
  - name: dispatched-triage
    type: 'tool_used'
    tool: 'Agent'
    input_match: 'proposal-triage'
  - name: verdict-first
    type: 'regex'
    target: 'last_message'
    pattern: '^\s*`*\s*(CREATE|SUPPRESS|DUPLICATE|GATE_BLIND): '
  - name: verdict-create
    type: 'regex'
    target: 'last_message'
    pattern: '(^|\n)\s*CREATE: '
    weight: 3
  - name: not-covered-by-memory
    type: 'regex'
    target: 'last_message'
    pattern: 'covered-by-memory'
    match: 'not_contains'
    weight: 2
