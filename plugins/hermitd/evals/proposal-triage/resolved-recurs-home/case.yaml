schema_version: "1.1"
name: resolved-recurs-home
description: 'Same problem as a resolved proposal that came back: not DUPLICATE; CREATE with closest_prop.'
tags: [proposal-triage, train]
expected_outcome: 'CREATE plus closest_prop: T-20260814-100004'
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 8
  timeout_seconds: 400
  allowed_tools: [Agent, Read, Glob, Grep]
  prompt: |
    You are running proposal-create's triage step for this hermit. Dispatch the `hermitd:proposal-triage` agent with the input below. Replace {ROOT} with the absolute path of `.hermit` in your current working directory and {MEM} with the absolute path of the `memory` directory beside it (also directly in your working directory); change nothing else. Then reply with the agent's output verbatim, with nothing added.

    <input>
    Anchor: root={ROOT} memory_dir={MEM}
    Proposal task digest: {"ok":true,"proposals":[{"id":"T-20260814-100004","status":"completed","title":"Notify when the washing machine finishes","source":"auto-detected","category":"improvement","created":"2026-08-14T10:00:00+01:00","tags":[]},{"id":"T-20260814-100009","status":"open","title":"Skip garden irrigation when rain is forecast","source":"auto-detected","category":"improvement","created":"2026-08-14T10:00:00+01:00","tags":[]},{"id":"T-20260814-100011","status":"cancelled","title":"Daily energy usage report in the morning brief","source":"auto-detected","category":"improvement","created":"2026-08-14T10:00:00+01:00","tags":[]},{"id":"T-20260814-100013","status":"open","title":"Send household notices in Portuguese","source":"auto-detected","category":"improvement","created":"2026-08-14T10:00:00+01:00","tags":[]},{"id":"T-20260814-100015","status":"open","title":"Auto-lock the front door at midnight","source":"auto-detected","category":"improvement","created":"2026-08-14T10:00:00+01:00","tags":[]}]}
    Title: Washer-finished notices stopped arriving
    Evidence Source: current-session
    Evidence: Since the washer firmware update, the finished notice failed on 3 of the last 5 loads and laundry stayed wet overnight twice. Re-pointing the automation to the new power-sensor entity fixes it.
    </input>
graders:
  - name: dispatched-triage
    type: 'tool_used'
    tool: 'Agent'
    input_match: 'proposal-triage'
  - name: verdict-first
    type: 'regex'
    target: 'last_message'
    pattern: '^\s*`*\s*(CREATE|SUPPRESS|DUPLICATE|GATE_BLIND): '
  - name: verdict-create
    type: 'regex'
    target: 'last_message'
    pattern: '(^|\n)\s*CREATE: '
    weight: 3
  - name: meta-closest_prop
    type: 'regex'
    target: 'last_message'
    pattern: '(^|\n)\s*closest_prop: T-20260814-100004'
    weight: 2
  - name: not-duplicate
    type: 'regex'
    target: 'last_message'
    pattern: '(^|\n)\s*DUPLICATE:'
    match: 'not_contains'
    weight: 2
