schema_version: "1.1"
name: first-chat-portuguese-time
description: 'Fresh first chat answers in Portuguese and checks time before setting a purpose.'
tags: [first-chat, heldout]
expected_outcome: 'Portuguese reply confirms the time, invites one real job and keeps OPERATOR.md unchanged until consent.'
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write, Edit]
  env: {EVAL_HERMIT_RESIDENT: "1"}
  prompt: 'Olá! Acabaram de te instalar para me ajudares no dia a dia.'
graders:
  - name: first-chat-in-portuguese
    type: llm
    criteria: 'PASS if the operator-facing reply is in Portuguese, uses the injected current time to ask whether that is the operator’s time, and asks what useful job to do. FAIL if it invents a purpose, writes OPERATOR.md without consent, or only reports readiness.'
  - name: no-unapproved-purpose-write
    type: tool_used
    tool: Write
    input_match: 'OPERATOR\.md'
    min: 0
    max: 0
  - name: no-unapproved-purpose-edit
    type: tool_used
    tool: Edit
    input_match: 'OPERATOR\.md'
    min: 0
    max: 0
