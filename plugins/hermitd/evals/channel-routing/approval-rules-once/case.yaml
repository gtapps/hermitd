schema_version: "1.1"
name: approval-rules-once
description: 'A temporary instruction stays conversational.'
tags: [channel-routing, approval-rules-eval]
expected_outcome: 'Acknowledge through the channel; no settings change.'
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 6
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep]
  env: {EVAL_HERMIT_RESIDENT: "1"}
  prompt: |
    <system-reminder>
    Hermit state for this turn. This session has no shell: use these script results; do not run scripts.
    - config.json: operator_profile=technical; language unset; channels.discord.allowed_users=["100000000000000001"].
    - task.ts list --open --conversation discord:400000000000000001: {"rows":[],"total":0,"omitted":0}
    </system-reminder>
    <system-reminder>
    UserPromptSubmit hook additional context:
    [channel reply reminder] Inbound message arrived on the `discord` channel (chat_id=`400000000000000001`). Every reply, including a short acknowledgement, must go through `mcp__plugin_discord_discord__reply` with chat_id="400000000000000001". Transcript/terminal output does not reach the operator.
    Handle it with the channel-responder skill: invoke `/hermitd:channel-responder` now; no invocation has been observed in this session since the last context reset.
    </system-reminder>
    <channel source="plugin:discord:discord" chat_id="400000000000000001" message_id="500000000000000034" user="sam" user_id="100000000000000001" ts="2026-10-01T09:24:00.000Z">
    Don't push until I review.
    </channel>
graders:
  - name: reply
    type: tool_used
    tool: 'mcp__plugin_discord_discord__reply'
  - name: no-settings
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:hermitd:)?hermit-settings"'
    min: 0
    max: 0
