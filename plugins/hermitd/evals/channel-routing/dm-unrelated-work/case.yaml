schema_version: "1.1"
name: dm-unrelated-work
description: "A DM with an open task receives independent work."
tags: [channel-routing, heldout]
expected_outcome: "New work opens its own task and dispatches now; disk-trend is not replaced or steered."
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 6
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep]
  env: {EVAL_HERMIT_RESIDENT: "1"}
  prompt: |
    <system-reminder>
    Hermit state for this turn. This session has no shell: each line below is what that hermit script returns right now. Use it as the script result; do not try to run scripts or read state files, directly or through subagents. Every other step of the skill runs as written.
    - config.json: operator_profile=technical; language unset; channels.discord.allowed_users=["100000000000000001"] (first entry is the primary operator).
    - task.ts list --open --conversation discord:400000000000000001: {"rows":[{"id":"T-20261001-091000","handle":"disk-trend","title":"Check disk usage trend","listing":["open"],"waiting_on":null,"owner":"worker:a1b2c3d4","requester":"discord:100000000000000001"}],"total":1,"omitted":0}
    - conversation.ts thread-open: {"key":"discord:400000000000000001","chat_id":"400000000000000001"}
    - task.ts open: {"id":"T-20261001-093000","handle":"<slug of the --title>","created":true,"open_count":2,"queued":false}
    - task.ts note, task.ts block: OK
    </system-reminder>
    <system-reminder>
    UserPromptSubmit hook additional context:
    [open tasks in this chat: total=1 omitted=0; disk-trend T-20261001-091000 "Check disk usage trend" owner=worker state=open] a message continuing one of these steers it; new work opens its own task; if unsure which, ask once naming them.
    [channel reply reminder] Inbound message arrived on the `discord` channel (chat_id=`400000000000000001`). Every reply, including a short acknowledgement, must go through `mcp__plugin_discord_discord__reply` with chat_id="400000000000000001". Transcript/terminal output does not reach the operator.
    Handle it with the channel-responder skill: invoke `/hermitd:channel-responder` now; no invocation has been observed in this session since the last context reset.
    </system-reminder>
    <channel source="plugin:discord:discord" chat_id="400000000000000001" message_id="500000000000000016" user="sam" user_id="100000000000000001" ts="2026-10-01T09:06:00.000Z">
    also investigate renewal options for our domain and recommend one for my approval
    </channel>
graders:
  - name: replied-via-channel
    type: tool_used
    tool: 'mcp__plugin_discord_discord__reply'
  - name: task-skill
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:hermitd:)?task"'
    weight: 2
  - name: new-task-dispatched
    type: tool_used
    tool: 'Agent'
    input_match: 'hermitd:task-worker'
    weight: 2
