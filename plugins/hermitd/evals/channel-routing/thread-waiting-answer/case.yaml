schema_version: "1.1"
name: thread-waiting-answer
description: 'In a real thread: an answer to a waiting record in its thread goes through task answer.'
tags: [channel-routing, heldout]
expected_outcome: 'The answer is recorded through task answer.'
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 6
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep, Bash]
  env: {EVAL_HERMIT_RESIDENT: "1"}
  prompt: |
    <system-reminder>
    UserPromptSubmit hook additional context:
    [task thread discord:400000000000000001: owner=resident, muted=false, waiting=true]
    [waiting task T-20261001-091400: Need the reporting account name; next: Configure access once the name arrives; finished outcome: .hermit/bin/hermitd-run task block .hermit T-20261001-091400 --result-stdin; wait answered: .hermit/bin/hermitd-run task answer .hermit T-20261001-091400 --chat discord:400000000000000001 --user 100000000000000001 --reply <token>; legacy wait: .hermit/bin/hermitd-run task note .hermit T-20261001-091400 --clear-waiting --chat <chat> --user <user>; nothing is owed when this message does not change the task]
    [channel reply reminder] Inbound message arrived on the `discord` channel (chat_id=`400000000000000001`). Every reply, including a short acknowledgement, must go through `mcp__plugin_discord_discord__reply` with chat_id="400000000000000001". Transcript/terminal output does not reach the operator.
    Handle it with the channel-responder skill: invoke `/hermitd:channel-responder` now; no invocation has been observed in this session since the last context reset.
    </system-reminder>
    <channel source="plugin:discord:discord" chat_id="400000000000000001" message_id="500000000000000023" user="sam" user_id="100000000000000001" ts="2026-10-01T09:13:00.000Z">
    the account name is ops-reports
    </channel>
graders:
  - name: answer-boundary
    type: tool_used
    tool: 'Bash'
    input_match: 'task(?:\.ts)? answer[\s\S]*--chat[\s\S]*--user[\s\S]*--reply'
