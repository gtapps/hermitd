schema_version: "1.1"
name: standing-work-inspect
description: 'Asking what the agent watches is standing work, not a task.'
tags: [channel-routing, train]
expected_outcome: 'Standing work branch (reference.md); no task.'
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 6
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep]
  env: {EVAL_HERMIT_RESIDENT: "1"}
  prompt: |
    <system-reminder>
    Hermit state for this turn. This session has no shell: each line below is what that hermit script returns right now. Use it as the script result; do not try to run scripts or read state files, directly or through subagents.
    - config.json: operator_profile=technical; language unset; channels.discord.allowed_users=["100000000000000001"] (first entry is the primary operator).
    - task.ts list --open --conversation discord:400000000000000001: {"rows":[],"total":0,"omitted":0}
    - proposal-micro match: {"status":"none","reason":"no_pending"}
    - proposal-index (proposals-index.json): []
    - settings-get-routines: [{"id":"morning-brief","skill":"hermitd:brief","schedule":"0 8 * * *","enabled":true},{"id":"backup-report","skill":"backup-check","schedule":"0 18 * * 5","enabled":true},{"id":"heartbeat-restart","skill":"hermitd:heartbeat","schedule":"*/30 * * * *","enabled":true}]
    - routines-health: {"morning-brief":{"last_fire":"2026-10-01T08:00:02+01:00","failure_total":0},"backup-report":{"last_fire":"2026-09-26T18:00:05+01:00","failure_total":2,"last_precheck_error":"backup target unreachable"},"heartbeat-restart":{"last_fire":"2026-10-01T09:30:00+01:00","failure_total":0}}
    - state/monitors.runtime.json: [{"id":"deploy-log","description":"Watch the deploy log for errors","class":"config","started_at":"2026-10-01T07:55:00+01:00"}]
    </system-reminder>
    <system-reminder>
    UserPromptSubmit hook additional context:
    [channel reply reminder] Inbound message arrived on the `discord` channel (chat_id=`400000000000000001`). Every reply, including a short acknowledgement, must go through `mcp__plugin_discord_discord__reply` with chat_id="400000000000000001". Transcript/terminal output does not reach the operator.
    Handle it with the channel-responder skill: invoke `/hermitd:channel-responder` now; no invocation has been observed in this session since the last context reset.
    </system-reminder>
    <channel source="plugin:discord:discord" chat_id="400000000000000001" message_id="500000000000000036" user="sam" user_id="100000000000000001" ts="2026-10-01T09:26:00.000Z">
    what are you keeping an eye on for me right now?
    </channel>
graders:
  - name: replied-via-channel
    type: tool_used
    tool: 'mcp__plugin_discord_discord__reply'
  - name: no-task-skill
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:hermitd:)?task"'
    min: 0
    max: 0
    weight: 2
  - name: names-the-failing-backup-report
    type: regex
    target: 'mock_calls'
    pattern: 'backup'
    flags: 'i'
  - name: names-the-deploy-watch
    type: regex
    target: 'mock_calls'
    pattern: 'deploy'
    flags: 'i'
  - name: no-cron-strings
    type: regex
    target: 'mock_calls'
    pattern: '\d+ \d+ \* \* \d|\*/\d+ \*'
    flags: 'i'
    match: 'not_contains'
