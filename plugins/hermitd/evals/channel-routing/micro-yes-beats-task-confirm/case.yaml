schema_version: "1.1"
name: micro-yes-beats-task-confirm
description: 'Task decision reply: input/chat as admin'
tags: [channel-routing, decision-replies]
expected_outcome: 'Acknowledge the answered task without exposing internal ids.'
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep, Bash]
  env: {EVAL_HERMIT_RESIDENT: "1"}
  prompt: |
    <system-reminder>
    UserPromptSubmit hook additional context:
    [open tasks in this chat: total=1 omitted=0; t-20261001-090000 T-20261001-090000 "Should the reports run weekly?" owner=resident state=waiting on chat] a message continuing one of these steers it; new work opens its own task; if unsure which, ask once naming them.
    [waiting task T-20261001-090000 actor=discord:100000000000000001; commands (use the row's id, revision and actor): .hermit/bin/hermitd-run task block .hermit <id> --result-stdin; wait answered: .hermit/bin/hermitd-run task answer .hermit <id> --chat <chat> --user <user> --reply <token>; legacy wait: .hermit/bin/hermitd-run task note .hermit <id> --clear-waiting --chat <chat> --user <user>; nothing is owed when this message does not change the task]
    [channel reply reminder] Inbound message arrived on the `discord` channel (chat_id=`400000000000000001`). Every reply, including a short acknowledgement, must go through `mcp__plugin_discord_discord__reply` with chat_id="400000000000000001". Transcript/terminal output does not reach the operator.
    Handle it with the channel-responder skill: invoke `/hermitd:channel-responder` now; no invocation has been observed in this session since the last context reset.
    </system-reminder>
    <channel source="plugin:discord:discord" chat_id="400000000000000001" message_id="500000000000000036" user="sam" user_id="100000000000000001" ts="2026-10-01T09:26:00.000Z">
    yes
    </channel>
graders:
  - name: answer-boundary
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'task(?:\.ts)? answer[\s\S]*--chat[\s\S]*--user[\s\S]*--reply'
    weight: 3
  - name: reply
    type: 'tool_used'
    tool: 'mcp__plugin_discord_discord__reply'
  - name: decision-verdict
    type: 'llm'
    focus: 'mock_calls'
    criteria: |
      PASS if the channel reply follows this verdict: Acknowledge the answered task without exposing internal ids. FAIL otherwise.
    weight: 2
