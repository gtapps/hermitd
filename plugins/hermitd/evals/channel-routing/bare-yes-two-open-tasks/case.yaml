schema_version: "1.1"
name: bare-yes-two-open-tasks
description: 'Bare yes with two open tasks and no thread or handle: ask which.'
tags: [channel-routing, train]
expected_outcome: 'One short question naming both handles; nothing confirmed.'
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 6
  timeout_seconds: 240
  allowed_tools: [Skill, Read, Glob, Grep]
  env: {EVAL_HERMIT_RESIDENT: "1"}
  prompt: |
    <system-reminder>
    Hermit state for this turn. This session has no shell: each line below is what that hermit script returns right now. Use it as the script result; do not try to run scripts or read state files, directly or through subagents.
    - config.json: operator_profile=technical; language unset; channels.discord.allowed_users=["100000000000000001"] (first entry is the primary operator).
    - task.ts list --open --conversation discord:400000000000000001: {"rows":[{"id":"T-20261001-091200","handle":"release-note","title":"Draft release note","listing":["unconfirmed"],"waiting_on":"discord:100000000000000001","result_rev":1,"requester":"discord:100000000000000001","due":null,"owner":"resident"},{"id":"T-20261001-091000","handle":"disk-trend","title":"Check disk usage trend","listing":["unconfirmed"],"waiting_on":"discord:100000000000000001","result_rev":1,"requester":"discord:100000000000000001","due":null,"owner":"resident"}],"total":2,"omitted":0}
    - proposal-micro match: NONE|no-pending
    - proposal-index (proposals-index.json): []
    </system-reminder>
    <system-reminder>
    UserPromptSubmit hook additional context:
    [channel reply reminder] Inbound message arrived on the `discord` channel (chat_id=`400000000000000001`). Every reply, including a short acknowledgement, must go through `mcp__plugin_discord_discord__reply` with chat_id="400000000000000001". Transcript/terminal output does not reach the operator.
    Handle it with the channel-responder skill: invoke `/hermitd:channel-responder` now; no invocation has been observed in this session since the last context reset.
    </system-reminder>
    <channel source="plugin:discord:discord" chat_id="400000000000000001" message_id="500000000000000027" user="sam" user_id="100000000000000001" ts="2026-10-01T09:17:00.000Z">
    yes
    </channel>
graders:
  - name: replied-via-channel
    type: tool_used
    tool: 'mcp__plugin_discord_discord__reply'
  - name: names-both-handles
    type: regex
    target: 'mock_calls'
    pattern: 'release-note[\s\S]*disk-trend|disk-trend[\s\S]*release-note'
