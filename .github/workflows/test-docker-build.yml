name: Test Docker Build

# Build config-rendered Docker images and verify the runtime and optional hook.

on:
  push:
    branches: [main]
    paths:
      - 'plugins/hermitd/state-templates/docker/**'
      - 'plugins/hermitd/scripts/render-docker-templates.ts'
      - '.github/workflows/test-docker-build.yml'
  pull_request:
    paths:
      - 'plugins/hermitd/state-templates/docker/**'
      - 'plugins/hermitd/scripts/render-docker-templates.ts'
      - '.github/workflows/test-docker-build.yml'

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shape: current
            runner: ubuntu-latest
          - shape: hook
            runner: ubuntu-latest
          - shape: browser
            runner: ubuntu-latest
          - shape: browser-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Render from config
        run: |
          mkdir -p build/.hermit
          echo '{"docker":{"packages":[],"git_identity_mount":true},"channels":{},"browser":{"enabled":true}}' > build/.hermit/config.json
          bun plugins/hermitd/scripts/render-docker-templates.ts "$PWD/build"
          if [ "${{ matrix.shape }}" = hook ]; then
            cat > build/docker-build.hermit-local.sh <<'HOOK'
          set -e
          test "$(id -u)" = 0
          command -v claude
          command -v bun
          touch /opt/hermit-build/hook-ran-as-root
          HOOK
          fi

      - name: Build the image
        run: docker build --build-arg HERMIT_BROWSER=${{ startsWith(matrix.shape, 'browser') && '1' || '0' }} -t hermit-ci:${{ matrix.shape }} -f build/Dockerfile.hermit build

      - name: Verify the optional root hook
        if: matrix.shape == 'hook'
        run: docker run --rm --entrypoint bash hermit-ci:${{ matrix.shape }} -lc 'test -f /opt/hermit-build/hook-ran-as-root && test "$(id -un)" = claude'

      # The pin is the point: a floating install would still build fine.
      - name: Verify the pinned runtime inside the image
        run: |
          got=$(docker run --rm --entrypoint bash hermit-ci:${{ matrix.shape }} -lc 'bun --version')
          echo "bun in image: $got"
          test "$got" = "1.4.2"
          docker run --rm --entrypoint bash hermit-ci:${{ matrix.shape }} -lc 'claude --version'

      - name: Verify the managed browser
        if: startsWith(matrix.shape, 'browser')
        run: |
          docker run --rm -i --entrypoint bash \
            -v "$PWD/plugins/hermitd:/plugin:ro" \
            -e HERMIT_PLUGIN_ROOT=/plugin \
            hermit-ci:${{ matrix.shape }} -s <<'BROWSER_CHECK'
          set -e
          test -f /opt/novnc/core/rfb.js
          test -f /etc/hermit/managed-browser
          test "$(command -v agent-browser)" = /usr/local/bin/agent-browser
          test "$(agent-browser --session ci --version)" = "agent-browser 0.41.0"
          /opt/chrome-linux64/chrome --version | grep -F "156.0.8078.80"
          bun - <<'BROWSER_SMOKE'
          const server = Bun.serve({
            port: 0,
            hostname: '127.0.0.1',
            fetch: () => new Response('<title>Hermit browser CI</title><p>Local page</p>', { headers: { 'content-type': 'text/html' } }),
          });
          try {
            for (const args of [
              ['open', server.url.href],
              ['get', 'title'],
              ['close'],
            ]) {
              const child = Bun.spawn(['agent-browser', '--session', 'ci', ...args], { stdout: 'pipe', stderr: 'inherit' });
              const output = await new Response(child.stdout).text();
              console.log(output);
              if (await child.exited !== 0) throw new Error('Browser command failed');
              if (args[0] === 'get' && !output.includes('Hermit browser CI')) throw new Error('Wrong page title');
            }
          } finally {
            server.stop();
          }
          BROWSER_SMOKE
          BROWSER_CHECK
