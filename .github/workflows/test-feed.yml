name: Test Feed Hermit

on:
  push:
    branches: [main]
    paths:
      - 'plugins/hermitd-feed/**'
      - 'tests/lib/**'
      - '.github/workflows/test-feed.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
  pull_request:
    paths:
      - 'plugins/hermitd-feed/**'
      - 'tests/lib/**'
      - '.github/workflows/test-feed.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bunx tsc

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/hermitd-feed
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Run test suite
        run: bun test
