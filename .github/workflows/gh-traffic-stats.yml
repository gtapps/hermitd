name: gh-traffic-stats
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-traffic-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: gtapps/gh-traffic-stats@f05c995b41d817087f7f728dd1794af559d81471 # v1.0.0
        with:
          token: ${{ secrets.GH_TRAFFIC_STATS_TOKEN }}
          metrics: clones
          clones-label: downloads
