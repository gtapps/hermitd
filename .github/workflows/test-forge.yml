name: Test Forge

on:
  push:
    branches: [main]
    paths:
      - 'plugins/hermitd-laravel-forge/**'
      - 'tests/lib/**'
      - '.github/workflows/test-forge.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
  pull_request:
    paths:
      - 'plugins/hermitd-laravel-forge/**'
      - 'tests/lib/**'
      - '.github/workflows/test-forge.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bunx tsc

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/hermitd-laravel-forge
    steps:
      - uses: actions/checkout@v4
      # Plugin pins php ^8.5 (composer.json platform) — the runner must match.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: json, curl
      - name: Install Forge SDK (composer)
        run: composer install --no-dev --no-interaction --no-progress --working-dir=php
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Run test suite (PHP unit + hook + skill-structure)
        run: bash tests/run-all.sh
