name: Test Forge

on:
  push:
    branches: [main]
    paths:
      - 'plugins/hermitd-laravel-forge/**'
      - 'tests/lib/**'
      - '.github/workflows/test-forge.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
  pull_request:
    paths:
      - 'plugins/hermitd-laravel-forge/**'
      - 'tests/lib/**'
      - '.github/workflows/test-forge.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bunx tsc

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/hermitd-laravel-forge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Plugin pins php ^8.5 (composer.json platform) — the runner must match.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: json, curl
      - name: Install Forge SDK (composer)
        run: composer install --no-dev --no-interaction --no-progress --working-dir=php
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Run test suite (PHP unit + hook + skill-structure)
        run: bash tests/run-all.sh
