name: Plugin Validate
# Runs Claude Code's native `claude plugin validate` over every plugin and the
# marketplace, so schema, hook and MCP problems go red at the pull request
# instead of at release time. scripts/plugin-validate.sh owns the gate: any
# error, or any warning except the plugin-root CLAUDE.md note and TypeScript
# diagnostics outside a hooks module's folder.
on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/marketplace.json'
      - 'scripts/plugin-validate.sh'
      - '.github/workflows/test-plugin-validate.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - '.claude-plugin/marketplace.json'
      - 'scripts/plugin-validate.sh'
      - '.github/workflows/test-plugin-validate.yml'

jobs:
  plugin-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Claude Code
        shell: bash
        run: curl -fsSL https://claude.ai/install.sh | bash
      - name: Validate plugins
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/cfg"
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/cfg" bash scripts/plugin-validate.sh
      - name: Test core mod
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/cfg"
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/cfg" claude plugin test plugins/hermitd/mod
