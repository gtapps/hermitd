name: macOS Compat

# macOS compatibility checks on one runner. Keep suites sequential and
# bound core file workers so subprocess-heavy tests do not consume every CPU.
on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC: a macOS-only regression in TS-only code surfaces
    # here within days rather than at a release.
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      # The platform-specific surfaces: shell that meets BSD userland, scripts
      # that branch on process.platform, and every plugin's tests/. The last one
      # is load-bearing: the first run of this job failed on test fixtures, not on
      # product code (unresolved os.tmpdir() compared against resolved
      # process.cwd()), so a test-only push has to be able to retrigger it.
      - 'plugins/*/scripts/**'
      - 'plugins/*/hooks/**'
      - 'plugins/*/state-templates/bin/**'
      - 'plugins/*/tests/**'
      - 'plugins/*/bunfig.toml'
      - '.github/workflows/test-macos-compat.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
  pull_request:
    paths:
      - 'plugins/*/scripts/**'
      - 'plugins/*/hooks/**'
      - 'plugins/*/state-templates/bin/**'
      - 'plugins/*/tests/**'
      - 'plugins/*/bunfig.toml'
      - '.github/workflows/test-macos-compat.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

# Only revisions of the same PR supersede each other. Manual comparisons,
# scheduled runs, and main pushes retain their own run groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    # Sequential across six suites, and 20+ core test files spawn real tmux: a wedged pane
    # would otherwise sit on the 6h job default and the weekly run reports
    # nothing at all. Green runs take about 2m; 5m fails a hung run fast.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # HA's gate-corpus.test.ts materializes the retired Python gates from
          # git history, so it needs the full history (matches test-ha.yml).
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      # Python is a TEST FIXTURE for the HA suite only; nothing shipped runs it.
      # gate-corpus replays the retired Python hooks and yaml-parity compares
      # against PyYAML. Same versions test-ha.yml pins.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml python-dotenv
      - run: bun install --frozen-lockfile
      # 20+ core test files spawn real tmux sessions; it is not preinstalled on
      # macOS runners. Printing the version also proves the suite below is
      # exercising tmux rather than silently skipping.
      - name: Ensure tmux
        run: tmux -V || (brew install tmux && tmux -V)
      # Two core file workers overlap subprocess waits. Tests within each file
      # also run concurrently via bunfig.toml, so keep the worker count bounded.
      # --timeout stays at 45s as headroom for the in-test
      # Date.now() poll deadlines (harness-command-delivery, proc-survivor,
      # hermitd-stop) that --timeout does not itself extend.
      - name: Core suite
        if: '!cancelled()'
        run: bun test --parallel=2 --timeout=45000
        working-directory: plugins/hermitd
      - name: Home Assistant suite
        if: '!cancelled()'
        run: bun test --timeout=45000
        working-directory: plugins/hermitd-homeassistant
      - name: Feed suite
        if: '!cancelled()'
        run: bun test --timeout=45000
        working-directory: plugins/hermitd-feed
      - name: Dev suite
        if: '!cancelled()'
        run: bash tests/run-all.sh
        working-directory: plugins/hermitd-dev
      - name: Fitness suite
        if: '!cancelled()'
        run: bash tests/run-all.sh
        working-directory: plugins/hermitd-fitness
      - name: Scribe suite
        if: '!cancelled()'
        run: bash tests/run-all.sh
        working-directory: plugins/hermitd-scribe
      # hermitd-laravel-forge is excluded: tests/run-all.sh shells out to composer
      # and php, neither reliably present on a macOS runner. Adding a PHP
      # toolchain here is a separate decision.
