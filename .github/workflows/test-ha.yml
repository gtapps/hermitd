name: Test HA Hermit

on:
  push:
    branches: [main]
    paths:
      - 'plugins/hermitd-homeassistant/**'
      - '.github/workflows/test-ha.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
  pull_request:
    paths:
      - 'plugins/hermitd-homeassistant/**'
      - '.github/workflows/test-ha.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/gate-corpus.test.ts materializes the retired Python gates
          # from git history (42c0c8f~1) for side-by-side equivalence runs.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      # Python here is a TEST FIXTURE only (nothing shipped runs it): the
      # golden-corpus test replays the retired Python hooks against the TS
      # ports, and yaml-parity.test.ts compares against PyYAML.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml python-dotenv
      - run: bun install --frozen-lockfile
      - run: bunx tsc
      # Previously pinned to --parallel=4 (333d7334) on an unverified
      # "ubuntu-latest is 4 vCPU" assumption; reverted (6287b1f8) after a
      # subprocess test consumed most of the 5s default timeout under CI
      # contention. Bare --parallel self-tunes to whatever the runner
      # actually has instead of repeating that assumption; --timeout is the
      # headroom that actually fixes the contention. Kept in step with the
      # core suite's value. Local `bun test` stays on the 5s default so
      # genuine slowness still surfaces in dev.
      - run: bun test --parallel --timeout=45000
        working-directory: plugins/hermitd-homeassistant
