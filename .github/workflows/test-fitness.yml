name: Test Fitness Hermit

on:
  push:
    branches: [main]
    paths:
      - 'plugins/hermitd-fitness/**'
      - 'tests/lib/**'
      - '.github/workflows/test-fitness.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
  pull_request:
    paths:
      - 'plugins/hermitd-fitness/**'
      - 'tests/lib/**'
      - '.github/workflows/test-fitness.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bunx tsc

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/hermitd-fitness
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Run test suite
        run: bash tests/run-all.sh
