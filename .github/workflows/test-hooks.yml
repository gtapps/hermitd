name: Test Hooks

on:
  push:
    branches: [main]
    paths:
      - 'plugins/hermitd/**'
      # Cross-plugin invariants in hooks.contract.test.ts walk every plugin's
      # manifest and the marketplace, so those paths must trigger this suite too.
      - 'plugins/*/.claude-plugin/**'
      # operator-doc-refs.test.ts walks every plugin's state-templates for bare
      # docs/ refs, so a sibling plugin's state-template edit must run this suite.
      - 'plugins/*/state-templates/**'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/test-hooks.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
  pull_request:
    paths:
      - 'plugins/hermitd/**'
      # Cross-plugin invariants in hooks.contract.test.ts walk every plugin's
      # manifest and the marketplace, so those paths must trigger this suite too.
      - 'plugins/*/.claude-plugin/**'
      # operator-doc-refs.test.ts walks every plugin's state-templates for bare
      # docs/ refs, so a sibling plugin's state-template edit must run this suite.
      - 'plugins/*/state-templates/**'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/test-hooks.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      # No-op until the first .ts lands; tsc exits 18003 on zero inputs, so gate on file presence.
      - run: |
          if [ -n "$(find plugins -name '*.ts' -print -quit)" ]; then
            bunx tsc
          else
            echo "no .ts files yet — skipping typecheck"
          fi
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      # Previously pinned to --parallel=4 (333d7334) on an unverified
      # "ubuntu-latest is 4 vCPU" assumption; reverted (6287b1f8) after a
      # subprocess test consumed most of the 5s default timeout under CI
      # contention. Bare --parallel self-tunes to whatever the runner
      # actually has instead of repeating that assumption; --timeout is the
      # headroom that actually fixes the contention. It must stay above the
      # in-test `Date.now()` poll deadlines (harness-command-delivery,
      # proc-survivor, hermitd-stop) — --timeout does not extend those, so a
      # value below them makes them unreachable. Local `bun test` stays on
      # the 5s default so genuine slowness still surfaces in dev.
      - run: bun test --parallel --timeout=45000
        working-directory: plugins/hermitd
